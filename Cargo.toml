[package]
name = "osmtools"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.46", features = ["derive"] }
geojson = "0.24.2"
itertools = "0.14.0"
log = "0.4.27"
ordered-float = "5.0.0"
osmpbfreader = { version = "0.19.1", features = ["serde"] }
regex = "1.11.2"
serde = "1.0.219"
serde_json = "1.0.143"
simple_logger = { version = "5.0.0", features = ["stderr"] }
smartstring = "1.0.1"

[profile.release]
panic = "abort"
strip = true
codegen-units = 1
lto = "thin"

[profile.profiling]
inherits="release"
strip = false
debug = true

[lints.clippy]
pedantic = { level = "deny" }
